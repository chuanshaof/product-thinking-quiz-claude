<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Product Thinking Quiz</title>
<style>
  :root {
    --paper: #f2eee7;
    --card: #fffdf9;
    --ink: #1a1916;
    --ink-soft: #3d3a34;
    --muted: #6f6a61;
    --line: #e5ded2;
    --line-soft: #efe9df;
    --accent: #5b4bd6;
    --accent-ink: #4536bd;
    --accent-wash: #efecff;
    --warm: #d98d3a;
    --good: #0f7b5f;
    --good-wash: #e7f4ef;
    --bad: #b8402f;
    --bad-wash: #fbecea;
    --shadow: 0 1px 2px rgba(26, 25, 22, .04), 0 12px 32px -12px rgba(26, 25, 22, .14);
    --shadow-lift: 0 1px 2px rgba(26, 25, 22, .05), 0 18px 40px -14px rgba(26, 25, 22, .2);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 18px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #131217;
      --card: #1b1a21;
      --ink: #f0eef5;
      --ink-soft: #d6d3de;
      --muted: #9b96a6;
      --line: #2c2a35;
      --line-soft: #24222c;
      --accent: #a394ff;
      --accent-ink: #b9adff;
      --accent-wash: #221f33;
      --warm: #e3a45f;
      --good: #4ecfa0;
      --good-wash: #162b25;
      --bad: #ff8b78;
      --bad-wash: #2f1d1b;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px -16px rgba(0, 0, 0, .6);
      --shadow-lift: 0 1px 2px rgba(0, 0, 0, .35), 0 22px 48px -16px rgba(0, 0, 0, .7);
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 20px 56px;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* Soft light behind everything */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(60vw 46vw at 12% -6%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 62%),
      radial-gradient(52vw 40vw at 92% 4%, color-mix(in srgb, var(--warm) 20%, transparent), transparent 60%),
      radial-gradient(70vw 50vw at 50% 108%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 65%);
    opacity: .55;
  }

  .shell { max-width: 660px; margin: 0 auto; }

  /* ---------- Masthead ---------- */
  .masthead {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 4px 18px;
  }
  .monogram {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    font: 700 13px/1 var(--sans);
    letter-spacing: .02em;
    flex: 0 0 auto;
  }
  .wordmark {
    font: 600 13px/1 var(--sans);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .counter {
    margin-left: auto;
    font: 600 13px/1 var(--sans);
    letter-spacing: .1em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .counter.show { opacity: 1; }

  /* ---------- Progress rail ---------- */
  .rail {
    height: 3px;
    border-radius: 99px;
    background: var(--line);
    overflow: hidden;
    margin: 0 4px 22px;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .rail.show { opacity: 1; }
  .rail span {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--warm));
    transition: width .5s cubic-bezier(.4, 0, .2, 1);
  }

  /* ---------- Card ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px;
  }

  h1 {
    font: 400 34px/1.15 var(--serif);
    letter-spacing: -.015em;
    margin: 0 0 14px;
  }
  h2 {
    font: 400 25px/1.3 var(--serif);
    letter-spacing: -.01em;
    margin: 0 0 26px;
  }
  h1:focus, h2:focus { outline: none; }
  p { margin: 0 0 18px; }
  .lede { color: var(--muted); font-size: 17px; max-width: 52ch; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font: 600 11px/1 var(--sans);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent-ink);
    background: var(--accent-wash);
    border-radius: 99px;
    padding: 7px 13px;
    margin: 0 0 18px;
  }
  .eyebrow::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
  }

  .rule {
    height: 1px;
    background: var(--line-soft);
    border: 0;
    margin: 0 0 26px;
  }

  /* ---------- Options ---------- */
  .options { display: grid; gap: 12px; margin: 0 0 26px; }

  .option {
    position: relative;
    display: flex;
    gap: 14px;
    align-items: center;
    width: 100%;
    text-align: left;
    font: 16px/1.5 var(--sans);
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 15px 18px;
    cursor: pointer;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease, opacity .3s ease;
  }
  .option:hover:not(:disabled) {
    transform: translateY(-1px);
    border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
    box-shadow: var(--shadow-lift);
  }
  .option:active:not(:disabled) { transform: translateY(0); }
  .option:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  .option:disabled { cursor: default; }

  .badge {
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 27px;
    height: 27px;
    border-radius: 8px;
    background: var(--line-soft);
    color: var(--muted);
    font: 600 13px/1 var(--sans);
    transition: background .18s ease, color .18s ease;
  }
  .option:hover:not(:disabled) .badge { background: var(--accent-wash); color: var(--accent-ink); }

  .option.is-correct {
    border-color: color-mix(in srgb, var(--good) 45%, transparent);
    background: var(--good-wash);
    color: var(--ink);
  }
  .option.is-correct .badge { background: var(--good); color: #fff; }
  .option.is-wrong {
    border-color: color-mix(in srgb, var(--bad) 45%, transparent);
    background: var(--bad-wash);
    color: var(--ink);
  }
  .option.is-wrong .badge { background: var(--bad); color: #fff; }
  .option.is-muted { opacity: .45; }

  .option .flag {
    margin-left: auto;
    flex: 0 0 auto;
    font: 600 11px/1 var(--sans);
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .option.is-correct .flag { color: var(--good); }
  .option.is-wrong .flag { color: var(--bad); }

  /* ---------- Explanation ---------- */
  .explanation {
    border-left: 2px solid var(--accent);
    padding: 4px 0 4px 22px;
    margin: 0 0 28px;
  }
  .explanation:focus { outline: none; }
  .verdict {
    display: flex;
    align-items: center;
    gap: 9px;
    font: 600 15px/1 var(--sans);
    margin: 0 0 14px;
  }
  .verdict .dot {
    display: grid;
    place-items: center;
    width: 21px;
    height: 21px;
    border-radius: 50%;
    color: #fff;
    font-size: 12px;
  }
  .verdict.correct { color: var(--good); }
  .verdict.correct .dot { background: var(--good); }
  .verdict.wrong { color: var(--bad); }
  .verdict.wrong .dot { background: var(--bad); }
  .explanation p { color: var(--ink-soft); margin: 0 0 14px; }
  .explanation p:last-child { margin-bottom: 0; }
  .source {
    font: 600 11px/1.4 var(--sans) !important;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted) !important;
    padding-top: 4px;
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font: 600 15px/1 var(--sans);
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 11px;
    padding: 14px 24px;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--accent) 80%, transparent);
  }
  @media (prefers-color-scheme: dark) { .btn { color: #17151f; } }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -10px color-mix(in srgb, var(--accent) 85%, transparent); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .btn .arrow { transition: transform .18s ease; }
  .btn:hover .arrow { transform: translateX(3px); }

  .btn-quiet {
    background: transparent;
    color: var(--muted);
    box-shadow: none;
    padding: 14px 8px;
  }
  .btn-quiet:hover { background: transparent; color: var(--ink); transform: none; box-shadow: none; }

  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .hint {
    font-size: 13px;
    color: var(--muted);
    margin: 18px 0 0;
  }
  .hint kbd {
    font: 600 11px/1 var(--sans);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 4px 6px;
    color: var(--ink-soft);
    background: var(--line-soft);
  }

  /* ---------- Results ---------- */
  .scoreboard {
    display: flex;
    align-items: center;
    gap: 26px;
    margin: 0 0 30px;
    flex-wrap: wrap;
  }
  .ring { flex: 0 0 auto; position: relative; width: 116px; height: 116px; }
  .ring svg { transform: rotate(-90deg); display: block; }
  .ring .track { stroke: var(--line); }
  .ring .fill {
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke-dashoffset 1.1s cubic-bezier(.4, 0, .2, 1);
  }
  .ring .label {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
  }
  .ring .num {
    font: 400 30px/1 var(--serif);
    font-variant-numeric: tabular-nums;
  }
  .ring .num small { font-size: 16px; color: var(--muted); }

  .review { list-style: none; padding: 0; margin: 0 0 30px; }
  .review li {
    display: flex;
    gap: 13px;
    align-items: flex-start;
    padding: 14px 0;
    border-top: 1px solid var(--line-soft);
    font-size: 15px;
  }
  .review li:last-child { border-bottom: 1px solid var(--line-soft); }
  .review .tick {
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    margin-top: 2px;
    border-radius: 50%;
    font-size: 11px;
    color: #fff;
  }
  .review .tick.correct { background: var(--good); }
  .review .tick.wrong { background: var(--bad); }
  .review .qtext { color: var(--ink-soft); }
  .review .fix { color: var(--muted); font-size: 14px; margin-top: 3px; }

  /* ---------- Footer ---------- */
  .colophon {
    margin: 22px 4px 0;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
  .colophon a { color: var(--muted); text-decoration-color: var(--line); text-underline-offset: 3px; }
  .colophon a:hover { color: var(--accent-ink); }

  /* ---------- Motion ---------- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(9px); }
    to { opacity: 1; transform: none; }
  }
  .anim { animation: rise .42s cubic-bezier(.22, 1, .36, 1) both; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 480px) {
    body { padding: 24px 14px 40px; }
    .card { padding: 26px 22px; border-radius: 15px; }
    h1 { font-size: 27px; }
    h2 { font-size: 21px; }
    .lede { font-size: 16px; }
    .option { padding: 14px 15px; gap: 12px; }
    .option .flag { display: none; }
    .scoreboard { gap: 18px; }
  }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<div class="shell">
  <header class="masthead">
    <span class="monogram" aria-hidden="true">PT</span>
    <span class="wordmark">Product Thinking</span>
    <span class="counter" id="counter" aria-hidden="true"></span>
  </header>

  <div class="rail" id="rail" aria-hidden="true"><span id="rail-fill"></span></div>

  <main class="card" id="app" aria-live="polite"></main>

  <p class="colophon">
    Questions drawn from the
    <a href="https://www.idg.gov.sg/product-thinking/">IDG Product Thinking</a> learning pathway.
  </p>
</div>

<script>
(function () {
  "use strict";

  var QUESTIONS = [
    {
      section: "product",
      question: "Most digital projects that fail do so for which reason?",
      options: [
        "They solve the wrong problem",
        "The engineering team shipped too slowly",
        "The technology stack was outdated",
        "The budget was too small"
      ],
      answer: 0,
      explanation: [
        "Many projects fail not because of poor execution, but because they solve the wrong problem. Teams reach for a CRM, or an AI feature, before diagnosing what is actually blocking the outcome.",
        "Diagnosis comes before prescription: problems before solutions."
      ],
      source: "Module 1 — Understanding the Problem"
    },
    {
      section: "product",
      question: "Which of these is an outcome rather than an output?",
      options: [
        "The new licensing portal was launched in Q3",
        "Median time to renew a licence fell from 3 days to 10 minutes",
        "Twelve features were shipped this quarter",
        "The portal recorded 5,000 logins last month"
      ],
      answer: 1,
      explanation: [
        "Outputs are things you produced: launches, features, logins. An outcome is the change in the world for the user — here, a renewal that used to take three days now takes ten minutes.",
        "Outcomes over outputs is one of the three core shifts of product thinking, alongside problems over solutions and staged delivery over big bang."
      ],
      source: "Modules 1 & 7 — Understanding the Problem / Key Takeaways"
    },
    {
      section: "product",
      question: "You run the Five Whys and surface several plausible root causes. Which one do you actually fix?",
      options: [
        "The deepest one you reached, since it is the true root",
        "The one that is cheapest to fix, regardless of impact",
        "The one within your team's control AND directly linked to the outcome you want",
        "All of them, in parallel"
      ],
      answer: 2,
      explanation: [
        "The Five Whys moves you from symptom to cause — but problems rarely have one root cause. The useful cause satisfies two conditions at once: it sits inside your team's control and influence, and it connects directly to the outcome you are chasing.",
        "Chasing a cause outside your remit, or one only loosely tied to the goal, burns effort without moving the outcome."
      ],
      source: "Module 2 — Start with the Whys"
    },
    {
      section: "product",
      question: "The 4Cs framework for writing a problem statement stands for:",
      options: [
        "Customer, Cost, Capability, Competition",
        "Clarity, Consequence, Cause, Confirmation",
        "Context, Constraint, Choice, Commitment",
        "Clarity, Collaboration, Consensus, Communication"
      ],
      answer: 1,
      explanation: [
        "Clarity — state the problem plainly. Consequence — spell out the impact. Cause — say why it exists. Confirmation — show the evidence that it is real.",
        "Worked example: citizens repeatedly fill the same forms across government services. Each C forces you to say what that costs, why it happens, and how you know."
      ],
      source: "Module 3 — Craft a Clear Problem Statement"
    },
    {
      section: "product",
      question: "Weekly active users of a new form is a ______ indicator; a 30% drop in case processing time is a ______ indicator.",
      options: [
        "leading; lagging",
        "lagging; leading",
        "vanity; SMART",
        "qualitative; quantitative"
      ],
      answer: 0,
      explanation: [
        "Leading indicators give you fast feedback early in the chain: usage, adoption, drop-off. Lagging indicators capture the result you actually care about, and arrive later.",
        "Knowing where a metric sits in that chain tells you whether you are looking at an early signal or a final verdict. Either way, make it SMART: Specific, Measurable, Achievable, Relevant, Time-bound."
      ],
      source: "Module 4 — Metrics"
    },
    {
      section: "product",
      question: "What does the Value-Cost Ratio (VCR) tell you?",
      options: [
        "How much of the budget has been spent to date",
        "How much value is generated for every dollar spent",
        "How many features shipped per sprint",
        "The ratio of users to support tickets"
      ],
      answer: 1,
      explanation: [
        "VCR quantifies efficiency: how much value is generated for every dollar spent. It is what you use to make the case for continuing to invest in something.",
        "In practice: work out your current VCR, then ask which specific change would improve it."
      ],
      source: "Module 4 — Metrics"
    },
    {
      section: "product",
      question: "You need to test market risk — will anyone actually want this? What is the cheapest way to find out?",
      options: [
        "Build a production-ready v1 and measure adoption after launch",
        "Run a stakeholder survey and a competitor analysis",
        "Put a rough, manual, unscalable prototype in front of real users now",
        "Wait for the technical proof of concept to be signed off"
      ],
      answer: 2,
      explanation: [
        "Market risk (do they want it?), technical risk (does it work?) and team risk (can we execute?) each get de-risked differently — and market risk is answered by real users, not by opinion.",
        "The health appointment example ran an A/B test off a deliberately manual setup: 24 bookings versus zero. Not scalable, but the lowest-cost way to validate the approach.",
        "That is what staged delivery buys you: proof of concept, then proof of value, then scale, then maturity."
      ],
      source: "Module 5 — Assumptions and Risks"
    },
    {
      section: "product",
      question: "What is the 11-star framework for?",
      options: [
        "Scoring services against a government quality standard",
        "Rating user satisfaction on an expanded survey scale",
        "Ranking a backlog by effort against impact",
        "Describing an absurdly good experience in order to recalibrate ambition"
      ],
      answer: 3,
      explanation: [
        "It is a tool for recalibrating ambition. You deliberately describe an absurdly good customer experience — well past what is reasonable — to break out of constraints you have quietly accepted.",
        "Somewhere between adequate and impossible lies an experience that is genuinely worth building. This matters most for compulsory services, where citizens cannot go elsewhere — the win is removing a real, named frustration, as ParkingSG and RedeemSG did."
      ],
      source: "Module 6 — A Good Customer Experience"
    },

    // -------------------------------------------------------------------
    // TODO: BONUS ROUND — replace the two placeholder questions below.
    // Edit `question`, the four `options`, `answer` (0-based index of the
    // correct option) and the `explanation` lines.
    // -------------------------------------------------------------------
    {
      section: "fun",
      question: "[PLACEHOLDER QUESTION 1 — replace me]",
      options: [
        "[Option A]",
        "[Option B]",
        "[Option C]",
        "[Option D]"
      ],
      answer: 0, // TODO: index of the correct option
      explanation: [
        "[Explanation for bonus question 1 — replace me.]"
      ],
      source: "Bonus round"
    },
    {
      section: "fun",
      question: "[PLACEHOLDER QUESTION 2 — replace me]",
      options: [
        "[Option A]",
        "[Option B]",
        "[Option C]",
        "[Option D]"
      ],
      answer: 0, // TODO: index of the correct option
      explanation: [
        "[Explanation for bonus question 2 — replace me.]"
      ],
      source: "Bonus round"
    }
  ];

  var LETTERS = ["A", "B", "C", "D", "E", "F"];
  var FIRST_FUN = QUESTIONS.findIndex(function (q) { return q.section === "fun"; });

  var app = document.getElementById("app");
  var rail = document.getElementById("rail");
  var railFill = document.getElementById("rail-fill");
  var counter = document.getElementById("counter");

  var state = { screen: "intro", index: 0, answers: [], focusTarget: null };

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined) { node.textContent = text; }
    return node;
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function score() {
    return state.answers.reduce(function (total, choice, i) {
      return total + (choice === QUESTIONS[i].answer ? 1 : 0);
    }, 0);
  }

  function answeredCount() {
    return state.answers.filter(function (a) { return a !== undefined; }).length;
  }

  function updateChrome() {
    var onQuiz = state.screen === "question" || state.screen === "bonus";
    rail.classList.toggle("show", onQuiz);
    counter.classList.toggle("show", onQuiz);
    if (onQuiz) {
      counter.textContent = pad(state.index + 1) + " / " + pad(QUESTIONS.length);
    }
    var done = state.screen === "results" ? QUESTIONS.length : answeredCount();
    railFill.style.width = (done / QUESTIONS.length * 100) + "%";
  }

  /* ---------- Screens ---------- */

  function renderIntro() {
    var wrap = el("div", "anim");
    wrap.appendChild(el("p", "eyebrow", "10 questions · ~5 minutes"));
    var h = el("h1", null, "How well do you think about problems?");
    h.id = "focus-target";
    h.tabIndex = -1;
    wrap.appendChild(h);
    wrap.appendChild(el("p", "lede",
      "Eight questions on the IDG Product Thinking pathway — problem statements, root causes, metrics, risk and customer experience — then a two-question bonus round about me."));
    wrap.appendChild(el("p", "lede",
      "Every answer comes with the reasoning behind it, so a wrong guess is still worth something."));

    var start = el("button", "btn", "Begin");
    start.type = "button";
    start.appendChild(el("span", "arrow", "→"));
    start.addEventListener("click", function () { go("question"); });
    wrap.appendChild(start);

    wrap.appendChild(hintLine());
    app.appendChild(wrap);
  }

  function hintLine() {
    var hint = el("p", "hint");
    hint.appendChild(document.createTextNode("Tip: press "));
    hint.appendChild(el("kbd", null, "A"));
    hint.appendChild(document.createTextNode("–"));
    hint.appendChild(el("kbd", null, "D"));
    hint.appendChild(document.createTextNode(" to answer, "));
    hint.appendChild(el("kbd", null, "Enter"));
    hint.appendChild(document.createTextNode(" to continue."));
    return hint;
  }

  function renderBonusDivider() {
    var wrap = el("div", "anim");
    wrap.appendChild(el("p", "eyebrow", "Bonus round"));
    var h = el("h1", null, "Two questions about me");
    h.id = "focus-target";
    h.tabIndex = -1;
    wrap.appendChild(h);
    wrap.appendChild(el("p", "lede",
      "That is the theory done — " + score() + " of " + FIRST_FUN + " so far. What follows is not in any guide."));
    var next = el("button", "btn", "Bring it on");
    next.type = "button";
    next.appendChild(el("span", "arrow", "→"));
    next.addEventListener("click", function () { go("question"); });
    wrap.appendChild(next);
    app.appendChild(wrap);
  }

  function renderQuestion() {
    var i = state.index;
    var q = QUESTIONS[i];
    var chosen = state.answers[i];
    var locked = chosen !== undefined;

    var head = el("div", "anim");
    if (q.section === "fun") {
      head.appendChild(el("p", "eyebrow", "Bonus · about me"));
    } else {
      head.appendChild(el("p", "eyebrow", "Question " + (i + 1)));
    }
    var h = el("h2", null, q.question);
    h.id = "focus-target";
    h.tabIndex = -1;
    head.appendChild(h);
    app.appendChild(head);

    var list = el("div", "options");
    q.options.forEach(function (text, idx) {
      var btn = el("button", "option anim");
      btn.type = "button";
      btn.style.animationDelay = (60 + idx * 55) + "ms";

      var badge = el("span", "badge", LETTERS[idx]);
      btn.appendChild(badge);
      btn.appendChild(el("span", null, text));

      if (locked) {
        btn.disabled = true;
        btn.style.animation = "none";
        if (idx === q.answer) {
          btn.classList.add("is-correct");
          badge.textContent = "✓";
          btn.appendChild(el("span", "flag", "Correct"));
        } else if (idx === chosen) {
          btn.classList.add("is-wrong");
          badge.textContent = "✗";
          btn.appendChild(el("span", "flag", "Your pick"));
        } else {
          btn.classList.add("is-muted");
        }
      } else {
        btn.addEventListener("click", function () { choose(idx); });
      }
      list.appendChild(btn);
    });
    app.appendChild(list);

    if (!locked) {
      app.appendChild(hintLine());
      return;
    }

    var right = chosen === q.answer;
    var box = el("div", "explanation anim");
    box.id = "explanation";
    box.tabIndex = -1;

    var verdict = el("p", "verdict " + (right ? "correct" : "wrong"));
    verdict.appendChild(el("span", "dot", right ? "✓" : "✗"));
    verdict.appendChild(document.createTextNode(
      right ? "Correct" : "Not quite — the answer is " + LETTERS[q.answer]));
    box.appendChild(verdict);

    q.explanation.forEach(function (para) { box.appendChild(el("p", null, para)); });
    if (q.source) { box.appendChild(el("p", "source", q.source)); }
    app.appendChild(box);

    var last = i === QUESTIONS.length - 1;
    var actions = el("div", "actions anim");
    actions.style.animationDelay = "80ms";
    var next = el("button", "btn", last ? "See your results" : "Next question");
    next.type = "button";
    next.appendChild(el("span", "arrow", "→"));
    next.addEventListener("click", advance);
    actions.appendChild(next);
    app.appendChild(actions);
  }

  function renderResults() {
    var total = QUESTIONS.length;
    var hits = score();

    var head = el("div", "anim");
    head.appendChild(el("p", "eyebrow", "Results"));
    var h = el("h1", null, hits === total ? "A clean sweep." : "Here is how you did.");
    h.id = "focus-target";
    h.tabIndex = -1;
    head.appendChild(h);
    app.appendChild(head);

    var board = el("div", "scoreboard anim");
    board.style.animationDelay = "70ms";

    var R = 50;
    var CIRC = 2 * Math.PI * R;
    var ring = el("div", "ring");
    ring.innerHTML =
      '<svg width="116" height="116" viewBox="0 0 116 116" aria-hidden="true">' +
        '<circle class="track" cx="58" cy="58" r="' + R + '" fill="none" stroke-width="7"></circle>' +
        '<circle class="fill" cx="58" cy="58" r="' + R + '" fill="none" stroke-width="7" ' +
          'stroke-dasharray="' + CIRC + '" stroke-dashoffset="' + CIRC + '"></circle>' +
      '</svg>';
    var label = el("div", "label");
    var num = el("p", "num", String(hits));
    num.style.margin = "0";
    num.appendChild(el("small", null, " / " + total));
    label.appendChild(num);
    ring.appendChild(label);
    board.appendChild(ring);

    var remark;
    if (hits === total) {
      remark = "Every one. Problems before solutions, outcomes over outputs — it has clearly landed.";
    } else if (hits >= total - 3) {
      remark = "Solid work. Worth a second pass through the module behind anything you missed.";
    } else {
      remark = "Plenty left to revisit — each explanation names the module it came from.";
    }
    var blurb = el("p", "lede", remark);
    blurb.style.margin = "0";
    blurb.style.flex = "1 1 240px";
    board.appendChild(blurb);
    app.appendChild(board);

    requestAnimationFrame(function () {
      var fill = ring.querySelector(".fill");
      if (fill) { fill.style.strokeDashoffset = String(CIRC * (1 - hits / total)); }
    });

    app.appendChild(el("hr", "rule"));

    var review = el("ul", "review anim");
    review.style.animationDelay = "110ms";
    QUESTIONS.forEach(function (q, i) {
      var right = state.answers[i] === q.answer;
      var row = el("li");
      row.appendChild(el("span", "tick " + (right ? "correct" : "wrong"), right ? "✓" : "✗"));
      var body = el("div");
      body.appendChild(el("div", "qtext", (i + 1) + ". " + q.question));
      if (!right) {
        body.appendChild(el("div", "fix", "Answer: " + q.options[q.answer]));
      }
      row.appendChild(body);
      review.appendChild(row);
    });
    app.appendChild(review);

    var actions = el("div", "actions anim");
    actions.style.animationDelay = "140ms";
    var again = el("button", "btn", "Take it again");
    again.type = "button";
    again.addEventListener("click", function () {
      state = { screen: "question", index: 0, answers: [], focusTarget: "heading" };
      render();
    });
    actions.appendChild(again);

    var link = el("a", "btn btn-quiet", "Read the pathway →");
    link.href = "https://www.idg.gov.sg/product-thinking/";
    actions.appendChild(link);
    app.appendChild(actions);
  }

  /* ---------- Transitions ---------- */

  function go(screen) {
    state.screen = screen;
    state.focusTarget = "heading";
    render();
  }

  function choose(idx) {
    if (state.answers[state.index] !== undefined) { return; }
    state.answers[state.index] = idx;
    state.focusTarget = "explanation";
    render();
  }

  function advance() {
    var i = state.index;
    if (i === QUESTIONS.length - 1) {
      go("results");
      return;
    }
    state.index = i + 1;
    go(state.index === FIRST_FUN ? "bonus" : "question");
  }

  function render() {
    app.textContent = "";
    if (state.screen === "intro") { renderIntro(); }
    else if (state.screen === "bonus") { renderBonusDivider(); }
    else if (state.screen === "results") { renderResults(); }
    else { renderQuestion(); }

    updateChrome();

    if (state.focusTarget) {
      var id = state.focusTarget === "explanation" ? "explanation" : "focus-target";
      var target = document.getElementById(id);
      if (target) { target.focus({ preventScroll: true }); }
      state.focusTarget = null;
    }
  }

  /* ---------- Keyboard ---------- */

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) { return; }
    var tag = document.activeElement && document.activeElement.tagName;

    if (state.screen === "question") {
      var q = QUESTIONS[state.index];
      var locked = state.answers[state.index] !== undefined;

      if (!locked) {
        var key = e.key.toLowerCase();
        var byLetter = LETTERS.findIndex(function (l) { return l.toLowerCase() === key; });
        var byNumber = /^[1-9]$/.test(key) ? Number(key) - 1 : -1;
        var pick = byLetter > -1 ? byLetter : byNumber;
        if (pick > -1 && pick < q.options.length) {
          e.preventDefault();
          choose(pick);
        }
        return;
      }
    }

    if (e.key === "Enter" && tag !== "BUTTON" && tag !== "A") {
      var primary = app.querySelector(".btn");
      if (primary && primary.tagName === "BUTTON") {
        e.preventDefault();
        primary.click();
      }
    }
  });

  render();
})();
</script>
</body>
</html>
